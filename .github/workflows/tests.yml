name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (TensorFlow is not needed for the tests)
        run: pip install "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.6.1" pypower scipy joblib pytest
      - name: Run tests
        run: pytest -q
